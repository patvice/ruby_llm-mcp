name: CICD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby_llm_compatibility:
    name: RubyLLM ${{ matrix.ruby_llm }} compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby_llm: ["~> 1.9.0", "~> 1.0", "~> 2.0"]
    env:
      RUBY_LLM_VERSION: ${{ matrix.ruby_llm }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check RubyLLM integration without external services
        run: bundle exec rspec --options /dev/null spec/ruby_llm/mcp/ruby_llm_compatibility_spec.rb

  test:
    name: Ruby Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        # ruby: ["3.1", "3.2", "3.3", "3.4", "4.0", "jruby-10.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install Ruby dependencies
        run: |
          bundle install

      - name: Install Bun dependencies for test fixtures
        run: |
          cd spec/fixtures/typescript-mcp && bun install
          cd ../../..
          cd spec/fixtures/pagination-server && bun install

      - name: Run specs
        run: bundle exec rake spec
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"

  rubocop:
    name: RuboCop (4.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rake rubocop
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
